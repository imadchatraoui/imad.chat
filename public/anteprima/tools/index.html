<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tools — imad.chat</title>
<meta name="robots" content="noindex">
<meta name="description" content="Piccoli strumenti che funzionano sul tuo telefono.">
<meta name="theme-color" content="#f5f4f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070810" media="(prefers-color-scheme: dark)">
<!-- TOOLS: l'indice degli strumenti, per famiglie. Le schede le scrive indice.js da un solo elenco (STRUMENTI, in cima al file):
     uno strumento nuovo è una riga lì, più il suo indirizzo qui sotto in <template id="tiIndirizzi"> quando è pronto.
     Ogni scheda ha un piccolo disegno vivo di quello che lo strumento fa (un codice QR vero, cinque colori, un valore che rotola). -->
<!-- i caratteri (Manrope, Geist Mono) sono copie accanto alle pagine, dichiarate in ../comune/pagina.css: la pagina non chiede niente a nessuno -->
<link rel="stylesheet" href="/anteprima/comune/pagina.css">
<link rel="stylesheet" href="/anteprima/tools/indice.css">
</head>
<body class="pg-corpo">
<div class="wall" aria-hidden="true"><i class="wall__a"></i><i class="wall__b"></i><i class="wall__g"></i></div>

<header class="pg-testa">
  <a class="pg-casa" href="/anteprima" aria-label="imad.chat, torna alla home"><span class="l9" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="s"></i><i></i><i></i><i></i><i></i></span></a>
  <p class="pg-titolo">Tools</p>
</header>

<main class="pg ti">
  <h1 class="pg-h1">Tools</h1>
  <p class="pg-lead">Piccoli strumenti, fatti con cura. Funzionano sul tuo telefono: quello che ci metti resta lì, non viene caricato da nessuna parte.</p>

  <!-- le famiglie e le schede: le scrive indice.js -->
  <div class="ti-famiglie" id="tiFamiglie"></div>

  <noscript><p class="pg-p">Le schede hanno bisogno di JavaScript. Lo strumento pronto: <a href="/anteprima/tools/qr">QR Studio</a>.</p></noscript>
</main>

<!-- gli indirizzi degli strumenti pronti, uno per strumento (data-strumento = id in STRUMENTI). Stanno qui e non nello script
     perché la build riscrive gli indirizzi dell'HTML e mai quelli dentro gli script. Uno strumento senza indirizzo resta «Presto». -->
<template id="tiIndirizzi">
  <a data-strumento="qr" href="/anteprima/tools/qr">QR Studio</a>
  <a data-strumento="converti" href="/anteprima/tools/converti">Convertitore</a>
</template>

<footer class="pg-piede"><a href="/anteprima">Torna alla home</a><span>Il cielo di questa pagina è quello di Torino, adesso.</span></footer>

<script src="/anteprima/dati/astro-lite.js"></script>
<script src="/anteprima/comune/pagina.js"></script>
<script src="/anteprima/qr/vendor/qrcode-generator.js"></script>
<script src="/anteprima/qr/qr-core.js"></script>
<script src="/anteprima/tools/indice.js"></script>
</body>
</html>
