<style>

:root[data-tema="chiaro"] .campo { background: linear-gradient(180deg, rgba(255,255,255,.3), transparent), linear-gradient(var(--vetro-base), var(--vetro-base)); box-shadow: 0 0 0 .5px rgba(46,40,100,.07), inset 0 1px 0 #fff, 0 1px 2px rgba(46,40,100,.14), 0 12px 26px -12px rgba(46,40,100,.17); }

.campo em { font-style: normal; flex: none; height: 40px; padding: 0 18px; border-radius: 20px; display: grid; place-items: center; font: 700 15px/1 var(--font-sans); letter-spacing: -.016em; color: #2b2210; background: linear-gradient(180deg, #f8e7b9, #ebd08a); box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 18px -10px rgba(0,0,0,.6); }
@media (min-width: 900px) { .contatto { left: auto; right: max(64px, calc(50vw - 560px)); padding: 84px 0 0; width: 440px; } .contatto h2 { font-size: 56px; } .voce { left: max(64px, calc(50vw - 560px)); top: 30px; } }
#c { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.comandi { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: none; align-items: center; gap: 12px; }
.tocca .comandi { display: flex; }

.barra i { position: absolute; left: 0; top: 21px; height: 2px; border-radius: 1px; background: var(--accent); width: 0; }

:root[data-tema="chiaro"] .barra i, :root[data-tema="chiaro"] .barra b { background: #b98a2e; }
.aiuto { position: fixed; left: 0; right: 0; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); margin: 0; padding: 0 24px; text-align: center; font: 500 11.5px/16px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-meta); opacity: 0; transition: opacity .35s ease; pointer-events: none; }

.campo { position: relative; }
.campo input { position: absolute; left: 0; top: 0; width: calc(100% - 96px); height: 100%; margin: 0; padding: 0 0 0 18px; border: 0; border-radius: 26px; background: transparent; color: transparent; caret-color: transparent; font: 500 16px/24px var(--font-sans); outline: none; -webkit-appearance: none; appearance: none; }
