<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="../comune/tema.js"></script>
<script>
/* il movimento (../home/moto.css, CASA.md 2d E), prima del primo disegno: html.is-pagina dice a moto.css che questa è una pagina interna;
   html.vt-<riquadro> dà alla parte uguale di questa pagina il nome del riquadro toccato nella casa (la transizione tra documenti, dove il
   browser la sa fare; il nome si toglie quando è finita); html.pg-entra fa salire la pagina da sola dove non la sa fare (l'iPhone di
   Imad, iOS 18.0), mai tornando indietro e mai con «meno movimento». ES2017 al massimo. */
(function () {
  var r = document.documentElement, id = "";
  r.classList.add("is-pagina");
  try { id = sessionStorage.getItem("imad.vt") || ""; } catch (e) { }
  if (/^[a-z]+$/.test(id)) {
    r.classList.add("vt-" + id);
    var via = function () { r.classList.remove("vt-" + id); };
    window.addEventListener("pagereveal", function (e) { if (e.viewTransition) e.viewTransition.finished.then(via, via); else via(); });
    window.addEventListener("pageshow", function (e) { if (e.persisted) via(); });
  }
  try {
    var n = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    var back = (n || {}).type === "back_forward" || !!(performance.navigation && performance.navigation.type === 2);
    var calm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    if (typeof CSSViewTransitionRule === "undefined" && !calm && !back) {
      r.classList.add("pg-entra");
      setTimeout(function () { r.classList.remove("pg-entra"); }, 900);
    }
  } catch (e) { }
})();
</script>
<style>
/* le transizioni tra documenti (moto.css, CASA.md 2d E): l'adesione sta qui, in linea, perché in un foglio esterno Chromium a volte la
   legge troppo tardi e salta la transizione; con «meno movimento» nessuna pagina la chiede */
@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }
</style>
<title>{{titolo}} — Nel mondo — imad.chat</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf6ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<!-- NEL MONDO, un testo di Imad. Il modello: scripts/home/build.mjs scrive una pagina così per ogni content/mondo/<nome>.md
     (online: /anteprima/mondo/<nome>). I segnaposto {{...}} li riempie la build, già con l'HTML sicuro (tutto il testo è
     protetto, i link solo http/https, niente HTML scritto a mano). Gli indirizzi qui sono relativi a casa/mondo/, come l'indice.
     Niente di nostro: solo le sue parole, la data, il luogo, la foto e le fonti se le dà. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../comune/pagina.css">
<link rel="stylesheet" href="mondo.css">
<link rel="stylesheet" href="../home/moto.css">
</head>

  <a class="pg-titolo mo-su" href="index.html">Nel mondo</a>
</header>

<main class="pg mo">

    <h1 class="mo-h1 mo-h1--testo" dir="auto">{{titolo}}</h1>
    {{immagine}}
    <div class="mo-testo">
{{corpo}}
    </div>
    {{fonti}}
  </article>
  <p class="mo-torna"><a class="pg-pill" href="index.html"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6.5L8.5 12l5.5 5.5"/></svg>Tutti i testi</a></p>
</main>

<footer class="pg-piede mo-piede"><a href="../home/index.html">Torna alla home</a></footer>

<script src="../comune/pagina.js"></script>
</body>
</html>
