<body class="pg-corpo">

<script>
/* la foto entra piano quando è pronta (senza movimento: c'è e basta) */
(function () {
  var img = document.querySelector(".sm-foto__img"), f = img && img.parentNode;
  if (!img || (window.PAGINA && window.PAGINA.still())) return;
  if (img.complete && img.naturalWidth) return;
  f.classList.add("is-attesa");
  function ok() { f.classList.remove("is-attesa"); }
  img.addEventListener("load", ok); img.addEventListener("error", ok);
})();
</script>
