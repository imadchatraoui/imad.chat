<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dot — tavola delle pose</title>
<style>html, body { margin: 0; } body { background: #0d1236; } body.light { background: #eceef4; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="dot-rig.js"></script>
<script>
/* Tavola delle pose: ogni casella è lo scheletro fermo in una posa, disegnato con un aspetto.
   ?look=base|adesivo|manifesto|pelo  ?bg=dark|light  ?k=2.6 (pixel per unità: 1.5 è la grandezza vera sul sito)  ?cols=6  ?pose=id,id (solo quelle)
   La casella è larga 58 × k pixel: apri la finestra larga almeno cols × 58 × k.
   Per le strisce di un'azione (camminata, ecc.) vedi ?striscia=walk|turn|blink&n=12 */
(function () {
  "use strict";
  var q = new URLSearchParams(location.search), lookName = q.get("look") || "base", light = q.get("bg") === "light", K = +(q.get("k") || 2.6), cols = +(q.get("cols") || 6), only = q.get("pose"), strip = q.get("striscia"), N = +(q.get("n") || 12);
  if (light) document.body.className = "light";
  var Y = DOT.YAW, V = "viewer";
  var LIST = [
    { id: "sit", label: "seduto", pose: "sit", yaw: Y.viewRight, look: V },
    { id: "sit-front", label: "seduto di fronte", pose: "sit", yaw: Y.front },
    { id: "sit-left", label: "seduto, guarda a sinistra", pose: "sit", yaw: Y.viewLeft, look: [0.5, 0.1], gaze: [-0.8, 0.2] },
    { id: "stand", label: "in piedi", pose: "stand", yaw: Y.right, look: V },
    { id: "walk0", label: "passo 1", pose: "stand", yaw: Y.right, look: V, walk: 0.0 },
    { id: "walk1", label: "passo 2", pose: "stand", yaw: Y.right, look: V, walk: 0.25 },
    { id: "walk2", label: "passo 3", pose: "stand", yaw: Y.right, look: V, walk: 0.5 },
    { id: "walk3", label: "passo 4", pose: "stand", yaw: Y.right, look: V, walk: 0.75 },
    { id: "walk-left", label: "cammina a sinistra", pose: "stand", yaw: Y.left, look: V, walk: 0.1 },
    { id: "loaf", label: "pagnotta", pose: "loaf", yaw: Y.viewRight, look: V },
    { id: "sleep", label: "dorme", pose: "sleep", yaw: Y.viewRight, look: [-0.3, 0] },
    { id: "puddle", label: "sciolto", pose: "puddle", yaw: Y.right, look: V },
    { id: "stretch", label: "si stiracchia", pose: "stretch", yaw: Y.right, look: [-0.3, 0] },
    { id: "yawn", label: "sbadiglia", pose: "yawn", yaw: Y.viewRight, look: V },
    { id: "crouch", label: "accucciato", pose: "crouch", yaw: Y.right, look: V },
    { id: "wiggle", label: "pronto a saltare", pose: "wiggle", yaw: Y.right, look: [-0.2, 0], pupil: 1 },
    { id: "air", label: "in aria", pose: "air", yaw: Y.right, look: [-0.3, 0], pitch: 0.28, rise: 7, grounded: false },
    { id: "land", label: "atterra", pose: "land", yaw: Y.right, look: V },
    { id: "startle", label: "spaventato", pose: "startle", yaw: Y.right, look: V, pupil: 0.35 },
    { id: "annoyed", label: "infastidito", pose: "annoyed", yaw: Y.viewLeft, look: V, swish: 0.5 },
    { id: "annoyed-back", label: "offeso, di spalle", pose: "annoyed", yaw: Y.backRight, look: [0, 0] },
    { id: "groom", label: "si lava", pose: "groom", yaw: Y.viewRight, look: [-0.2, -0.1] },
    { id: "belly", label: "a pancia in su", pose: "belly", yaw: Y.right, look: [-0.5, 0.1], roll: Math.PI, fez: false, loose: true },
    { id: "held", label: "preso", pose: "held", yaw: Y.viewRight, look: V, oy: 44, grounded: false },
    { id: "held-long", label: "preso: gatto lungo", pose: "held", yaw: Y.viewRight, look: V, long: 9, oy: 34, grounded: false },
    { id: "peek", label: "spunta dal bordo", pose: "peek", yaw: Y.front, edge: "top", clip: true, paws: true },
    { id: "drape", label: "a cavallo del bordo", pose: "drape", yaw: Y.right, look: [-0.75, -0.05], edge: "top", grounded: false },
    { id: "hang", label: "appeso", pose: "hang", yaw: Y.front, edge: "hang", grounded: false },
    { id: "slide", label: "scivola con i graffi", pose: "slide", yaw: Y.front, edge: "face", gazes: [[-0.6, 0.5], [0.5, -0.3]], pupil: 0.3, grounded: false },
    { id: "meow", label: "miagola", pose: "sit", yaw: Y.viewRight, look: V, over: { mouth: 0.85, hp: 0.14 } },
    { id: "purr", label: "fa le fusa", pose: "sit", yaw: Y.viewRight, look: V, over: { eye: 0, hp: 0.06 } },
    { id: "fez-off", label: "senza fez", pose: "sit", yaw: Y.viewRight, look: [-0.7, -0.25], gaze: [0.9, -0.6], fez: false, loose: true },
    { id: "look-l", label: "testa a sinistra", pose: "sit", yaw: Y.front, look: [0.9, 0] },
    { id: "look-r", label: "testa a destra, in su", pose: "sit", yaw: Y.front, look: [-0.9, 0.3], gaze: [0.6, 0.6] },
    { id: "profile", label: "profilo", pose: "stand", yaw: Y.right, look: [0, 0] },
    { id: "run", label: "corre", pose: "stand", yaw: Y.right, look: [-0.25, 0], walk: 0.3, speed: 150, pitch: -0.06 }
  ];
  if (only) { var ids = only.split(","); LIST = LIST.filter(function (s) { return ids.indexOf(s.id) >= 0; }); }
  if (strip) { LIST = []; for (var i = 0; i < N; i++) LIST.push(strip === "walk" ? { id: "w" + i, label: "passo " + (i + 1) + "/" + N, pose: "stand", yaw: Y.right, look: V, walk: i / N }
    : strip === "turn" ? { id: "t" + i, label: "giro " + (i + 1) + "/" + N, pose: i < N / 2 ? "stand" : "sit", yaw: Y.right + (Y.left - Y.right) * i / (N - 1), look: V }
    : { id: "b" + i, label: "occhi " + (i + 1) + "/" + N, pose: "sit", yaw: Y.viewRight, look: V, over: { eye: 1.3 - 1.3 * i / (N - 1), lid: i % 2 ? 0.4 : 0, brow: i % 3 === 0 ? 0.8 : 0 } }); }

  function setup(rig, s) {
    rig.over = s.over || {}; rig.yawT = s.yaw; rig.pitchT = s.pitch || 0; rig.rollT = s.roll || 0; rig.longT = s.long || 0; rig.fezOn = s.fez !== false; rig.grounded = s.grounded !== false; rig.autoBlink = false; rig.blink = 1;
    var lk = s.look === V ? [DOT.util.clamp(DOT.util.wrap(-Math.PI / 2 - s.yaw), -0.95, 0.95), 0.04] : s.look || [0, 0];
    rig.look.ty = lk[0]; rig.look.tp = lk[1]; var g = s.gazes || [s.gaze || [0, 0], s.gaze || [0, 0]];
    rig.gazeT[0].x = g[0][0]; rig.gazeT[0].y = g[0][1]; rig.gazeT[1].x = g[1][0]; rig.gazeT[1].y = g[1][1]; rig.pupilT = s.pupil == null ? 0.8 : s.pupil;
    rig.walkT = s.walk == null ? 0 : 1; rig.speedU = s.walk == null ? 0 : (s.speed || 44) / 1.5; rig.tailSwish = s.swish || 0;
    rig.snap(s.pose); if (s.walk != null) rig.gait = s.walk; rig.t = 1.3; rig._ws = Math.cos(rig.yaw) >= 0 ? 1 : -1;
  }

  function draw() {
    var look = DOT.looks[lookName] || DOT.looks.base, rig = DOT.makeRig(look.preset), cv = document.getElementById("c"), c = cv.getContext("2d");
    var u = K / 2.6, CW = Math.round(150 * u), CH = Math.round(160 * u), rows = Math.ceil(LIST.length / cols), dpr = Math.min(window.devicePixelRatio || 1, 3);   /* le caselle crescono con k */
    cv.width = cols * CW * dpr; cv.height = rows * CH * dpr; cv.style.width = cols * CW + "px"; cv.style.height = rows * CH + "px";
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    var tile = light ? "rgba(20,24,60,.07)" : "rgba(255,255,255,.085)", line = light ? "rgba(20,24,60,.16)" : "rgba(255,255,255,.14)", txt = light ? "rgba(20,24,50,.6)" : "rgba(255,255,255,.55)";
    LIST.forEach(function (s, idx) {
      var x0 = (idx % cols) * CW, y0 = Math.floor(idx / cols) * CH, ox = x0 + CW / 2, oy = y0 + 118 * u;
      c.save(); c.beginPath(); c.rect(x0, y0, CW, CH); c.clip();
      /* il «riquadro» finto: il gatto sta sul suo bordo alto, oppure ci pende, oppure ci scivola sopra */
      if (s.edge === "hang") { oy = y0 + 26 * u; c.fillStyle = tile; c.fillRect(x0 + 14 * u, y0 + 6 * u, CW - 28 * u, oy - y0 - 6 * u); }
      else if (s.edge === "face") { oy = y0 + 70 * u; c.fillStyle = tile; c.fillRect(x0 + 8 * u, y0 + 8 * u, CW - 16 * u, CH - 30 * u); }
      else if (s.oy) oy = y0 + s.oy * u;                              /* tenuto in aria: l'origine è il punto di presa */
      else { if (s.edge === "top") oy = y0 + 96 * u; c.fillStyle = tile; c.fillRect(x0 + 8 * u, oy, CW - 16 * u, y0 + CH - 22 * u - oy); }
      c.fillStyle = txt; c.font = "500 " + Math.max(9, Math.round(10 * Math.sqrt(u))) + "px system-ui, sans-serif"; c.textAlign = "center"; c.fillText(s.label, ox, y0 + CH - 7);
      setup(rig, s); var f = rig.frame();
      var env = { dark: !light, scale: K, shadow: s.oy || s.edge === "hang" || s.edge === "face" ? null : { y: -(s.rise || 0), k: s.rise ? 0.6 : 1 }, clipY: s.clip ? 0 : null, pawsOnEdge: !!s.paws };
      c.translate(ox, oy); c.scale(K, -K);
      if (s.rise) c.translate(0, s.rise);
      look.draw(c, f, env);
      if (s.loose && look.drawFez) { c.translate(15, 0); look.drawFez(c, { rBase: f.P.fez.rBase, rTop: f.P.fez.rTop, h: f.P.fez.h, ell: 0.22, top: true, tasselAng: 0.3 }, env); }
      c.restore();
      c.strokeStyle = line; c.lineWidth = 1; c.strokeRect(x0 + 0.5, y0 + 0.5, CW - 1, CH - 1);
    });
  }
  function load(src, cb) { var s = document.createElement("script"); s.src = src; s.onload = cb; s.onerror = cb; document.head.appendChild(s); }
  load("look-base.js", function () { if (lookName === "base") { draw(); window.__ready = true; } else load("look-" + lookName + ".js", function () { draw(); window.__ready = true; }); });
})();
</script>
</body>
</html>
