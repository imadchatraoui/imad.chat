<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dot — prova del comportamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Pagina di prova del cervello di Dot: riquadri finti come sul sito, scuri, con 16 px di margine.
     ?look=nome  ?primo=0 (niente apertura)  ?calma=1 (movimento ridotto)  ?k=1.9 (grandezza)  ?manual=1 (orologio fermo, per le strisce)  ?seme=7 */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; color: #fff; font: 500 14px/1.4 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0d1236; background: linear-gradient(180deg, #060818 0%, #0d1236 34%, #1b1f55 72%, #2c2660 100%); -webkit-font-smoothing: antialiased; }
  .pg { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 120px); }
  .hero { margin: 0 0 96px; }
  .hero b { display: block; font-weight: 800; font-size: 34px; letter-spacing: -.03em; }
  .hero span { font-size: 13px; color: rgba(255, 255, 255, .55); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .t { position: relative; height: var(--h, 170px); border-radius: 30px; overflow: hidden;
    background: rgba(255, 255, 255, .075); background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .05));
    -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1), inset 0 1px 0 rgba(255, 255, 255, .14), 0 18px 40px -24px rgba(0, 0, 0, .7); }
  .t--w { grid-column: 1 / -1; }
  .t i { position: absolute; left: 18px; bottom: 15px; font-style: normal; font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, .42); }
  .t[data-dot="no"] { background: linear-gradient(180deg, rgba(246, 238, 220, .16), rgba(246, 238, 220, .07)); }
  .note { margin: 26px 0 0; font-size: 13px; color: rgba(255, 255, 255, .55); text-align: center; }
  .bar { position: fixed; z-index: 60; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 14px); -webkit-transform: translateX(-50%); transform: translateX(-50%); display: flex; gap: 8px; }
  .bar button, .bar select { height: 40px; padding: 0 16px; border: 1px solid rgba(255, 255, 255, .22); border-radius: 20px; background: rgba(22, 22, 30, .86); color: #fff; font: 600 13px/1 inherit; font-family: inherit; cursor: pointer;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  @media (min-width: 760px) { .pg { max-width: 860px; } .grid { grid-template-columns: repeat(4, 1fr); } .t--w { grid-column: span 2; } }
</style>
</head>
<body>
<main class="pg">
  <header class="hero"><b>imad.chat_</b><span>prova: Dot da solo, su riquadri finti</span></header>
  <section class="grid">
    <div class="t t--w" style="--h: 176px" data-home><i>casa di Dot</i></div>
    <div class="t" style="--h: 150px"><i>Su di me</i></div>
    <div class="t" style="--h: 214px"><i>Le città</i></div>
    <div class="t" style="--h: 132px"><i>Saluti</i></div>
    <div class="t" style="--h: 188px"><i>Progetti</i></div>
    <div class="t t--w" style="--h: 230px" data-dot="no"><i>Corano (qui Dot non sale)</i></div>
    <div class="t t--w" style="--h: 156px" data-dot="quiet"><i>Nel mondo (Dot sta lontano)</i></div>
    <div class="t" style="--h: 168px"><i>Tools</i></div>
    <div class="t" style="--h: 118px"><i>Heatmap</i></div>
    <div class="t t--w" style="--h: 150px"><i>Sto imparando</i></div>
  </section>
  <p class="note">Tocca Dot, tienilo premuto, trascinalo e lascialo su un bordo o sulla faccia di un riquadro.</p>
</main>
<div class="bar"><button type="button" id="rivedi">Rivedi</button><select id="aspetto" aria-label="Aspetto"></select></div>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search), lookName = q.get("look");
  if (q.get("manual") === "1") window.__manual = true;
  var list = ["dot-rig.js", "look-base.js"]; ["adesivo", "manifesto", "pelo"].forEach(function (n) { list.push("look-" + n + ".js"); });
  if (lookName && ["base", "adesivo", "manifesto", "pelo"].indexOf(lookName) < 0) list.push("look-" + lookName + ".js");
  list.push("dot-stage.js", "dot-sound.js", "dot-fx.js", "dot-brain.js");
  function load(i) {
    if (i >= list.length) return go();
    var s = document.createElement("script"); s.src = list[i]; s.onload = s.onerror = function () { load(i + 1); }; document.head.appendChild(s);
  }
  function go() {
    var DOT = window.DOT; if (!DOT || !DOT.start) return;
    if (q.get("seme") && DOT.debug) DOT.debug.seed(+q.get("seme"));
    var sel = document.getElementById("aspetto"), names = Object.keys(DOT.looks || {});
    names.forEach(function (n) { var o = document.createElement("option"); o.value = n; o.textContent = (DOT.looks[n].label || n); sel.appendChild(o); });
    if (!lookName || !DOT.looks[lookName]) lookName = DOT.looks.adesivo ? "adesivo" : "base";
    sel.value = lookName; sel.addEventListener("change", function () { DOT.setLook(sel.value); });
    DOT.start({ tiles: ".t", home: document.querySelector("[data-home]"), look: lookName, firstVisit: q.get("primo") !== "0", reducedMotion: q.get("calma") === "1", dark: true, k: q.get("k") ? +q.get("k") : 0 });
    document.getElementById("rivedi").addEventListener("click", function () { window.scrollTo(0, 0); DOT.replay(); });
    window.__ready = true;
  }
  load(0);
})();
</script>
</body>
</html>
